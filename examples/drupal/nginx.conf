server {
    listen 8080;
    server_name localhost;
    root /app/web;
    index index.php;
    client_max_body_size 16m;

    location / {
        try_files $uri /index.php?$query_string;
    }
    location ~ /\. { deny all; }
    location ~ ^/sites/.*/files/.*\.php$ { deny all; }
    location ~ ^/(?:vendor|private)/ { deny all; }
    location ~ \.(?:yml|yaml|module|theme|install|inc|engine|twig|sql|sh)$ { deny all; }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass runtime:9000;
        fastcgi_keep_conn off;
        fastcgi_read_timeout 35s;
    }
}
